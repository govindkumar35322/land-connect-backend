<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>New Booking Request</title>

    <style>
        body{
            font-family:Arial,sans-serif;
            background:#f5f5f5;
            padding:30px;
        }

        .container{
            max-width:650px;
            margin:auto;
            background:white;
            padding:30px;
            border-radius:10px;
            box-shadow:0 0 10px rgba(0,0,0,.1);
        }

        h2{
            color:#2E7D32;
        }

        table{
            width:100%;
            border-collapse:collapse;
            margin-top:20px;
        }

        td{
            padding:10px;
            border-bottom:1px solid #ddd;
        }

        .button{
            display:inline-block;
            margin-top:25px;
            background:#2E7D32;
            color:white;
            padding:12px 25px;
            text-decoration:none;
            border-radius:5px;
        }

        .footer{
            margin-top:30px;
            color:gray;
            font-size:13px;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>🏡 New Booking Request</h2>

    <p>Hello <b>{{ownerName}}</b>,</p>

    <p>You have received a new booking request.</p>

    <table>

        <tr>
            <td><b>Buyer</b></td>
            <td>{{buyerName}}</td>
        </tr>

        <tr>
            <td><b>Land</b></td>
            <td>{{landTitle}}</td>
        </tr>

        <tr>
            <td><b>Visit Date</b></td>
            <td>{{visitDate}}</td>
        </tr>

        <tr>
            <td><b>Status</b></td>
            <td>Pending Approval</td>
        </tr>

    </table>

    <a class="button"
       href="http://localhost:3000/bookings">

        Review Booking

    </a>

    <div class="footer">

        Land Connect Team

    </div>

</div>

</body>
</html>
