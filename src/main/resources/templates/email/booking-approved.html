<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Booking Approved</title>
    <style>
        body{
            font-family:Arial,sans-serif;
            background:#f5f5f5;
            padding:30px;
        }

        .container{
            max-width:650px;
            margin:auto;
            background:white;
            padding:30px;
            border-radius:10px;
            box-shadow:0 0 10px rgba(0,0,0,.1);
        }

        h2{
            color:#2E7D32;
        }

        table{
            width:100%;
            border-collapse:collapse;
            margin-top:20px;
        }

        td{
            padding:10px;
            border-bottom:1px solid #ddd;
        }

        .button{
            display:inline-block;
            margin-top:20px;
            background:#2E7D32;
            color:white;
            padding:12px 24px;
            text-decoration:none;
            border-radius:5px;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>🎉 Booking Approved</h2>

    <p>Hello <b>{{buyerName}}</b>,</p>

    <p>Your booking has been approved by the land owner.</p>

    <table>

        <tr>
            <td><b>Land</b></td>
            <td>{{landTitle}}</td>
        </tr>

        <tr>
            <td><b>Owner</b></td>
            <td>{{ownerName}}</td>
        </tr>

        <tr>
            <td><b>Visit Date</b></td>
            <td>{{visitDate}}</td>
        </tr>

        <tr>
            <td><b>Status</b></td>
            <td>APPROVED</td>
        </tr>

    </table>

    <a href="http://localhost:3000/bookings" class="button">
        View Booking
    </a>

</div>

</body>
</html>
